<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Retrieval Scheduler</title>
    <!-- Google Fonts - Inter for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for body and overall layout */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5; /* Light grey background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Full viewport height */
            margin: 0;
            overflow: hidden; /* Prevent scrolling if content overflows */
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg border border-gray-200">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">XML Retrieval Scheduler</h1>

        <div class="flex flex-col space-y-4 mb-6">
            <!-- Start Button -->
            <button id="startButton" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-75">
                Start Scheduler
            </button>
            <!-- Stop Button -->
            <button id="stopButton" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-75">
                Stop Scheduler
            </button>
        </div>

        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
            <p class="text-lg font-medium text-gray-700 mb-2">Current Status:</p>
            <p id="statusDisplay" class="text-gray-600 text-sm">Loading status...</p>
        </div>

        <div class="bg-gray-900 text-white p-4 rounded-lg border border-gray-700 h-64 overflow-y-auto mt-6 font-mono text-xs">
            <p class="font-medium mb-2">Logs:</p>
            <div id="logContainer"></div>
        </div>
    </div>

    <!-- Link to your renderer process JavaScript -->
    <script src="renderer.js"></script>
</body>
</html>
